# bootc-image-builder config for the automated VM test ISO. NEVER use on real hardware:
# it wipes the first disk without asking. Test-only account: tester / kestrel-test.
[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Localization"]

[customizations.installer.kickstart]
contents = """
text --non-interactive
lang en_US.UTF-8
keyboard us
timezone UTC --utc
zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --noswap --type=btrfs
network --bootproto=dhcp --device=link --activate --onboot=on
user --name=tester --groups=wheel --password=kestrel-test --plaintext
rootpw --lock
poweroff

%post --erroronfail
# Online updates (DECISIONS.md D36): the new system gets its updates from Kestrel's signed
# image on the internet, not from the installer's copy.
bootc switch --mutate-in-place --transport registry --enforce-container-sigpolicy "$(cat /usr/share/kestrel/update-source)"
%end

%post --erroronfail
systemctl enable sshd.service
# Text-mode installs default to multi-user.target; the account exists, so skip Plasma Setup.
systemctl set-default graphical.target
touch /etc/plasma-setup-done
mkdir -p /etc/plasmalogin.conf.d
cat > /etc/plasmalogin.conf.d/zz-kestrel-test-autologin.conf <<'EOF2'
[Autologin]
User=tester
Session=plasma
EOF2

# Keep the test session visible: no screen lock, no display power-off.
install -d -o tester -g tester /home/tester/.config
cat > /home/tester/.config/kscreenlockerrc <<'EOF2'
[Daemon]
Autolock=false
LockOnResume=false
EOF2
cat > /home/tester/.config/powerdevilrc <<'EOF2'
[AC][Display]
DimDisplayWhenIdle=false
TurnOffDisplayWhenIdle=false

[AC][SuspendAndShutdown]
AutoSuspendAction=0
EOF2
chown tester:tester /home/tester/.config/kscreenlockerrc /home/tester/.config/powerdevilrc
%end
"""
