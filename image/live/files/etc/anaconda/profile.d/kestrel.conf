# Anaconda profile for Kestrel OS (DECISIONS.md D22). Picked by os-release VARIANT_ID=kestrel.
# Based on Fedora Kinoite: no user or root password screens (Plasma Setup creates the
# account on first boot), btrfs, the Kinoite partition layout. The installer's look comes
# from /usr/share/cockpit/branding/fedora-kestrel (it is the Anaconda Web UI).

[Profile]
profile_id = kestrel
base_profile = fedora-kinoite

[Profile Detection]
os_id = fedora
variant_id = kestrel

[Storage]
default_scheme = BTRFS
