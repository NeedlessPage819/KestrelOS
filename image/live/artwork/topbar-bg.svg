<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="132" viewBox="0 0 1040 132">
  <!-- Top bar of the installer's detail screens: the same gradient, left to right. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7cf2"/>
      <stop offset="0.55" stop-color="#8d6fd8"/>
      <stop offset="1" stop-color="#c06fae"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="132" fill="url(#g)"/>
</svg>
