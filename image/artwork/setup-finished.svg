<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Picture on the last page of the setup wizard (DECISIONS.md D24), instead of KDE's
       mascots: the Kestrel mark on an app-icon tile in the Kestrel accent colours. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#9aa6fa"/>
      <stop offset="1" stop-color="#4a58e0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1b1f5c" flood-opacity="0.35"/>
    </filter>
    <filter id="markshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="0.25" stdDeviation="0.3" flood-color="#1b1f5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="56" y="40" width="400" height="400" rx="92" fill="url(#tile)"/>
    <rect x="56" y="40" width="400" height="400" rx="92" fill="url(#gloss)"/>
  </g>
  <g transform="translate(96 72) scale(20)" filter="url(#markshadow)">
    <path fill="#ffffff"
          d="M1 6.2 C3.4 4.2 5.9 4.4 8 7.6 C10.1 4.4 12.6 4.2 15 6.2 C12.4 5.9 10.2 7.2 8 11.2 C5.8 7.2 3.6 5.9 1 6.2 Z"/>
  </g>
</svg>
