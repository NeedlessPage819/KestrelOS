# Kestrel OS login screen (DECISIONS.md D23): the Kestrel wallpaper behind the login, like
# the lock screen. Lowest priority: /etc/plasmalogin.conf and System Settings override it.
[Greeter]
WallpaperPluginId=org.kde.image
ShowClock=true

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/Kestrel/
