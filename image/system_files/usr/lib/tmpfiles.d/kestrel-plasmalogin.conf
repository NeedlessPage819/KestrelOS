# Kestrel OS (DECISIONS.md D24): the login screen uses dark colours, like the Mac's: white
# text on a softly darkened wallpaper. With light colours Plasma's login screen brightens the
# wallpaper to a washed-out pastel. Copied once ("C" never overwrites), so a choice made later
# in System Settings > Login Screen stays.
d /var/lib/plasmalogin/.config 0755 plasmalogin plasmalogin -
C /var/lib/plasmalogin/.config/kdeglobals - - - - /usr/share/kestrel/plasmalogin/kdeglobals
z /var/lib/plasmalogin/.config/kdeglobals 0644 plasmalogin plasmalogin -
